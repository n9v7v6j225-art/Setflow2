<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>SetFlow — 7 Day Tracker</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:20px 14px 40px}h1{margin:0 0 5px;font-size:32px}.sub{color:#64748b;font-size:13px}.card{background:#fff;border-radius:20px;padding:18px;margin:15px 0;box-shadow:0 4px 18px #0000000b}.head,.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}h2{font-size:18px;margin:0}.range{font-size:12px;color:#64748b}.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px}.total{background:#f8fafc;border:1px solid #e2e8f0;border-radius:15px;padding:13px}.name{text-transform:capitalize;font-weight:800}.num{font-size:26px;font-weight:900;float:right}.label{font-size:11px;color:#64748b;margin-top:8px;clear:both}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ex{border:1px solid #e2e8f0;border-radius:16px;padding:14px}.plus{width:100%;border:0;border-radius:12px;background:#2563eb;color:white;font-weight:900;font-size:16px;padding:12px;margin-top:10px}.small{border:0;border-radius:9px;background:#e2e8f0;padding:8px 12px;font-weight:900}.weeks,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weeks{margin-top:14px}.weeks div{text-align:center;font-size:10px;color:#64748b;font-weight:800}.day{min-height:42px;border:0;border-radius:10px;background:#f8fafc}.day.sel{background:#0f172a;color:white}.day.today{outline:2px solid #2563eb}.dot{display:block;width:5px;height:5px;background:#2563eb;border-radius:50%;margin:3px auto}.sel .dot{background:white}.chart{height:150px;display:flex;align-items:end;gap:8px}.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:5px}.wrap{height:115px;width:100%;display:flex;align-items:end;justify-content:center}.bar{width:32px;background:#2563eb;border-radius:8px 8px 3px 3px;min-height:3px}.col span{font-size:10px;color:#64748b}.hist{display:flex;justify-content:space-between;border-bottom:1px solid #e2e8f0;padding:10px 0;font-size:13px}.undo{border:0;background:#fee2e2;color:#991b1b;border-radius:8px;padding:7px;font-weight:800}.reset{width:100%;border:0;background:#e2e8f0;border-radius:12px;padding:13px;font-weight:800}.empty{text-align:center;color:#64748b;padding:15px}</style></head><body><div class="app"><h1>SetFlow 💪</h1><p class="sub">Rolling 7-day exercise tracker</p><div class="card"><div class="head"><h2>Each Exercise — Last 7 Days</h2><span class="range" id="range"></span></div><div class="totals" id="totals"></div></div><div class="card"><div class="head"><h2>Daily Activity</h2><span class="range">All exercises</span></div><div class="chart" id="chart"></div></div><div class="card"><div class="calhead"><button class="small" onclick="move(-1)">‹</button><b id="month"></b><button class="small" onclick="move(1)">›</button></div><div class="weeks"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div><div class="cal" id="cal"></div><p class="sub">Tap a date to log sets for that day.</p></div><div class="card"><div class="head"><h2>Log Sets</h2><span class="range" id="chosen"></span></div><div class="grid" id="ex"></div></div><div class="card"><div class="head"><h2>Recent Activity</h2><button class="small" onclick="undoLast()">Undo Last</button></div><div id="hist"></div></div><button class="reset" onclick="resetAll()">Reset All Data</button></div><script>const E=["chest","shoulder","bicep","triceps","back","grip","legs","abs","calves"];let D=JSON.parse(localStorage.getItem("setFlowData")||"{}"),sel=iso(new Date()),md=new Date();function iso(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()).toISOString().slice(0,10)}function lab(k){return new Date(k+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"})}function save(){localStorage.setItem("setFlowData",JSON.stringify(D))}function total(k){return Object.values(D[k]||{}).reduce((a,b)=>a+b,0)}function last7(){let a=[];for(let i=6;i>=0;i--){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);a.push(d)}return a}function rt(e){return last7().reduce((a,d)=>a+((D[iso(d)]||{})[e]||0),0)}function add(e){if(!D[sel])D[sel]={};D[sel][e]=(D[sel][e]||0)+1;save();render()}function undo(e,k){if(!D[k]||!D[k][e])return;D[k][e]--;if(D[k][e]<1)delete D[k][e];if(D[k]&&!Object.keys(D[k]).length)delete D[k];save();render()}function undoLast(){let ks=Object.keys(D).sort().reverse();if(ks.length){let es=Object.keys(D[ks[0]]);if(es.length)undo(es[es.length-1],ks[0])}}function resetAll(){if(confirm("Delete all logged sets?")){D={};save();render()}}function move(n){md.setMonth(md.getMonth()+n);calendar()}function calendar(){let y=md.getFullYear(),m=md.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),today=iso(new Date()),o="";document.getElementById("month").textContent=md.toLocaleDateString(undefined,{month:"long",year:"numeric"});for(let i=0;i<f;i++)o+="<div></div>";for(let i=1;i<=n;i++){let k=iso(new Date(y,m,i)),c="day"+(k===sel?" sel":"")+(k===today?" today":"");o+=`<button class="${c}" onclick="sel='${k}';render()">${i}${total(k)?'<span class="dot"></span>':""}</button>`}document.getElementById("cal").innerHTML=o}function render(){let ds=last7(),v=ds.map(d=>total(iso(d))),mx=Math.max(1,...v);document.getElementById("range").textContent=lab(iso(ds[0]))+"–"+lab(iso(ds[6]));document.getElementById("totals").innerHTML=E.map(e=>`<div class="total"><span class="name">${e}</span><span class="num">${rt(e)}</span><div class="label">sets in last 7 days</div></div>`).join("");document.getElementById("chart").innerHTML=ds.map((d,i)=>`<div class="col"><b>${v[i]}</b><div class="wrap"><div class="bar" style="height:${Math.max(3,v[i]/mx*100)}%"></div></div><span>${d.toLocaleDateString(undefined,{weekday:"short"}).slice(0,2)}</span></div>`).join("");calendar();document.getElementById("chosen").textContent=lab(sel);document.getElementById("ex").innerHTML=E.map(e=>`<div class="ex"><b class="name">${e}</b><div class="sub">${(D[sel]||{})[e]||0} sets on this day</div><button class="plus" onclick="add('${e}')">＋ Set</button></div>`).join("");let a=[];Object.keys(D).sort().reverse().forEach(k=>Object.keys(D[k]).forEach(e=>a.push({k,e,n:D[k][e]})));document.getElementById("hist").innerHTML=a.length?a.slice(0,20).map(x=>`<div class="hist"><span><b class="name">${x.e}</b> · ${lab(x.k)}<br>${x.n} set${x.n===1?"":"s"}</span><button class="undo" onclick="undo('${x.e}','${x.k}')">Undo 1</button></div>`).join(""):"<div class=empty>No sets logged yet.</div>"}render();</script></body></html>
